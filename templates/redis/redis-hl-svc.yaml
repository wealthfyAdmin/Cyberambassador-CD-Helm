{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.service.headlessName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.redis.name }}

spec:
  clusterIP: None
  selector:
    app: {{ .Values.redis.name }}

  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: {{ .Values.redis.service.port }}
{{- end }}
